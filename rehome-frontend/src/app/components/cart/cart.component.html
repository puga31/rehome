<h2>Carrito</h2>

<!-- Mensaje si el carrito está vacío -->
<p *ngIf="items.length === 0">
  El carrito está vacío
</p>

<!-- Lista de productos en el carrito -->
<ul *ngIf="items.length > 0">
  <li *ngFor="let item of items">
    <strong>{{ item.product.name }}</strong><br>

    Precio: {{ item.product.price | currency:'EUR' }}<br>
    Cantidad: {{ item.quantity }}<br>
    Subtotal:
    {{ (item.product.price || 0) * item.quantity | currency:'EUR' }}

    <br>

    <button (click)="removeOne(item.product.id)">➖</button>
    <button (click)="addOne(item.product)">➕</button>
  </li>
</ul>

<!-- Total -->
<p *ngIf="items.length > 0">
  <strong>Total:</strong> {{ total | currency:'EUR' }}
</p>

<!-- Botón vaciar carrito -->
<button *ngIf="items.length > 0" (click)="clear()">
  Vaciar carrito
</button>
