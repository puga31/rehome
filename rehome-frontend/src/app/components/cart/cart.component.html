<h2>Carrito</h2>

<!-- Mensaje si el carrito está vacío -->
<p *ngIf="items.length === 0">El carrito está vacío</p>

<!-- Lista de productos en el carrito -->
<ul *ngIf="items.length > 0">
  <li *ngFor="let item of items; let i = index">
    {{ item.name }} - {{ item.price !== null ? item.price + ' €' : 'Gratis' }}
    <button (click)="removeItem(i)">❌</button>
  </li>
</ul>

<!-- Total -->
<p *ngIf="items.length > 0"><strong>Total:</strong> {{ total | currency:'EUR' }}</p>

<!-- Botón vaciar carrito -->
<button *ngIf="items.length > 0" (click)="clear()">Vaciar carrito</button>
