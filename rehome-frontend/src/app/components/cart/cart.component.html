<div class="cart-container">
  <h2>Carrito</h2>

  <!-- Mensaje si el carrito está vacío -->
  <p *ngIf="items.length === 0">
    El carrito está vacío
  </p>

  <!-- Lista de productos en el carrito -->
  <ul *ngIf="items.length > 0" class="cart-list">
    <li *ngFor="let item of items" class="cart-item">
      <div class="item-info">
        <strong>{{ item.product.name }}</strong>
        <p>Precio: {{ item.product.price | currency:'EUR' }}</p>
        <p>Cantidad: {{ item.quantity }}</p>
        <p>
          Subtotal:
          {{ (item.product.price || 0) * item.quantity | currency:'EUR' }}
        </p>
      </div>

      <div class="item-actions">
        <button class="btn-minus" (click)="removeOne(item.product.id)">-</button>
        <button class="btn-plus" (click)="addOne(item.product)">+</button>
      </div>
    </li>
  </ul>

  <!-- Total -->
  <p *ngIf="items.length > 0" class="total">
    <strong>Total:</strong> {{ total | currency:'EUR' }}
  </p>

  <!-- Botón vaciar carrito -->
  <button *ngIf="items.length > 0" class="btn-clear" (click)="clear()">
    Vaciar carrito
  </button>
</div>
