<nav class="navbar">
  <a class="logo" routerLink="/">
    <img src="logo.png" alt="ReHome" class="logo-img">
  </a>

  <!-- Buscador -->
  <div class="search-container">
    <input
      matInput
      type="text"
      placeholder="Buscar producto..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearch()"
      class="search-input"
    />

    <ul *ngIf="suggestions.length > 0" class="suggestions">
      <li *ngFor="let p of suggestions" (click)="goToProduct(p.id)">
        {{ p.name }}
      </li>
    </ul>
  </div>

  <!-- Enlaces principales -->
  <ul class="nav-links">
    <!-- Dropdown de categorías -->
    <li class="dropdown">
      <a href="#">Productos ▼</a>
      <ul class="dropdown-menu">
        <li *ngFor="let cat of categories" (click)="goToCategory(cat.id)">
          {{ cat.name }}
        </li>
      </ul>
    </li>

    <!-- Enlace novedades -->
    <li><a routerLink="/latest">Novedades</a></li>

    <!-- Botón Vender -->
    <li>
      <a routerLink="/products/new" class="btn-primary">
        <mat-icon>add</mat-icon>
        Vender
      </a>
    </li>

    <!-- ICONO CARRITO -->
    <li>
      <a routerLink="/cart" class="icon-link">
        <mat-icon>shopping_cart</mat-icon>
        <span class="badge">{{ cartCount }}</span>
      </a>
    </li>

    <!-- ICONO LOGIN / LOGOUT -->
    <li *ngIf="!isLoggedIn()">
      <a routerLink="/login" class="icon-link">
        <mat-icon>person</mat-icon>
      </a>
    </li>

    <li *ngIf="isLoggedIn()">
      <a (click)="logout()" class="icon-link">
        <mat-icon>logout</mat-icon>
      </a>
    </li>
  </ul>
</nav>
