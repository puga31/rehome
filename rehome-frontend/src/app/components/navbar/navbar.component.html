<nav class="navbar">
  <div class="logo" routerLink="/">ReHome</div>

  <div class="search-container">
    <input
      type="text"
      placeholder="Buscar producto..."
      [(ngModel)]="searchTerm"
      (input)="onSearch()"
      class="search-input"
    />

    <ul *ngIf="suggestions.length > 0" class="suggestions">
      <li *ngFor="let p of suggestions" (click)="goToProduct(p.id)">
        {{ p.name }}
      </li>
    </ul>
  </div>

  <ul class="nav-links">
    <!-- Dropdown de categorías -->
    <li class="dropdown">
      <a href="#">Productos ▼</a>
      <ul class="dropdown-menu">
        <li *ngFor="let cat of categories" (click)="goToCategory(cat.id)">
          {{ cat.name }}
        </li>
      </ul>
    </li>

    <li><a routerLink="/products/new">Nuevo producto</a></li>
    <li><a routerLink="/cart">Carrito ({{ cartCount }})</a></li>
  </ul>
</nav>
