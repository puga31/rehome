<div class="product-list-container">

  <div *ngIf="loading" class="loading">
    Cargando productos...
  </div>

  <table *ngIf="!loading && products.length > 0" class="product-table">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Estado</th>
        <th>Precio</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.name }}</td>
        <td>{{ product.category?.name || 'Sin categoría' }}</td>
        <td>{{ product.condition }}</td>
        <td>
          {{ product.price != null ? (product.price | currency:'EUR':'symbol':'1.2-2') : 'Gratis' }}
        </td>
        <td class="actions">
          <button class="btn-view" (click)="viewProduct(product.id!)">Ver</button>
          <button class="btn-edit" (click)="editProduct(product.id!)">Editar</button>
          <button class="btn-delete" (click)="deleteProduct(product.id!)">Borrar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && products.length === 0" class="empty">
    No hay productos disponibles.
  </div>

</div>
