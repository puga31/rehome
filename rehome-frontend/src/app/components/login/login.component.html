<div class="login-container">

  <!-- Título dinámico -->
  <h2 *ngIf="!isRegisterMode">Iniciar sesión</h2>
  <h2 *ngIf="isRegisterMode">Crear cuenta</h2>

  <!-- Formulario único -->
  <form #form="ngForm" (ngSubmit)="isRegisterMode ? register() : login()">

    <!-- Nombre (solo registro) -->
    <div class="form-group" *ngIf="isRegisterMode">
      <label>Nombre</label>
      <input
        type="text"
        [(ngModel)]="name"
        name="name"
        required
        autocomplete="name"
      >
    </div>

    <!-- Email -->
    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        autocomplete="email"
      >
    </div>

    <!-- Contraseña -->
    <div class="form-group">
      <label>Contraseña</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        autocomplete="current-password"
      >
    </div>

    <!-- Confirmar contraseña (solo registro) -->
    <div class="form-group" *ngIf="isRegisterMode">
      <label>Confirmar contraseña</label>
      <input
        type="password"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        required
        autocomplete="new-password"
      >
    </div>

    <!-- Error -->
    <div *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </div>

    <!-- Botón -->
    <button type="submit" [disabled]="form.invalid">
      {{ isRegisterMode ? 'Registrarse' : 'Ingresar' }}
    </button>

  </form>

  <!-- Cambiar entre login y registro -->
  <p class="toggle-link">
    {{ isRegisterMode ? '¿Ya tienes cuenta? ' : '¿No tienes cuenta? ' }}
    <a class="register-link" (click)="toggleMode()">
      {{ isRegisterMode ? 'Inicia sesión' : 'Regístrate' }}
    </a>
  </p>

</div>
